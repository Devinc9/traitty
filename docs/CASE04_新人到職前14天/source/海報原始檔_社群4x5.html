<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#120E18; --plum:#1B1424; --violet:#B295E6; --violet-d:#6A4A9E;
  --paper:#F3EFF4; --mute:#8A7E9B; --ochre:#D9A05B; --teal:#7FB6C6;
}
html,body{width:1080px;height:1350px}
body{
  background:
    radial-gradient(120% 80% at 15% 0%, #2A1F3A 0%, transparent 55%),
    radial-gradient(100% 70% at 100% 100%, #241A33 0%, transparent 60%),
    var(--plum);
  color:var(--paper);
  font-family:"Noto Sans TC",sans-serif;
  padding:68px 74px;display:flex;flex-direction:column;
  position:relative;overflow:hidden;
}
body::after{
  content:"";position:absolute;left:74px;right:74px;top:0;height:6px;
  background:linear-gradient(90deg,var(--teal) 0%,var(--violet) 50%,var(--ochre) 100%);
}
.eyebrow{
  font-family:"Noto Sans TC",sans-serif;font-size:20px;letter-spacing:.34em;
  color:var(--violet);font-weight:500;text-transform:uppercase;
}
h1{
  font-family:"Noto Serif TC",serif;font-weight:900;
  font-size:88px;line-height:1.18;letter-spacing:-.01em;margin-top:20px;
}
h1 em{font-style:normal;color:var(--violet)}
.sub{
  margin-top:20px;font-size:25px;line-height:1.7;color:#C6BCD4;font-weight:400;
  padding-left:20px;border-left:4px solid var(--violet-d);
}
.rows{margin-top:42px;display:flex;flex-direction:column;gap:20px}
.row{
  background:rgba(255,255,255,.045);border:1px solid rgba(178,149,230,.22);
  border-radius:16px;padding:21px 28px;
}
.rname{
  font-family:"Noto Serif TC",serif;font-size:32px;font-weight:700;color:#fff;
  display:flex;align-items:baseline;gap:16px;
}
.rname span{
  font-family:"Noto Sans TC",sans-serif;font-size:16px;letter-spacing:.2em;
  color:var(--mute);font-weight:500;
}
.pair{display:flex;align-items:center;gap:22px;margin-top:14px}
.before{
  flex:1;font-size:23px;line-height:1.55;color:#9E93AE;
}
.arrow{color:var(--violet);font-size:30px;line-height:1}
.after{flex:1.35;font-size:23px;line-height:1.55;color:#F3EFF4;font-weight:500}
.tag{
  display:block;font-size:14px;letter-spacing:.2em;color:var(--mute);
  font-weight:500;margin-bottom:7px;
}
.after .tag{color:var(--violet)}
footer{margin-top:auto;padding-top:34px}
.kicker{
  font-family:"Noto Serif TC",serif;font-size:32px;line-height:1.58;color:#fff;font-weight:500;
}
.kicker b{color:var(--ochre);font-weight:700}
.meta{
  margin-top:26px;display:flex;align-items:center;justify-content:space-between;gap:24px;
  border-top:1px solid rgba(255,255,255,.14);padding-top:22px;
}
.brand{font-size:26px;font-weight:700;letter-spacing:.04em}
.brand small{display:block;font-size:15px;color:var(--mute);font-weight:400;letter-spacing:.12em;margin-top:5px}
.badge{
  font-size:17px;color:var(--ochre);border:1px solid rgba(217,160,91,.45);
  background:rgba(217,160,91,.10);padding:9px 18px;border-radius:999px;white-space:nowrap;
}
</style></head><body>
  <div class="eyebrow">Traitty AI ／ Case 04</div>
  <h1>同一套訓練<br><em>三種訊號</em></h1>
  <p class="sub">三位新人・到職第 3 天・沒有人說想離職<br>但主管知道，等問題累積再處理就太晚了</p>

  <div class="rows">
    <div class="row">
      <div class="rname">Roger</div>
      <div class="pair">
        <div class="before"><span class="tag">主管的印象</span>太急了，所以容易出錯</div>
        <div class="arrow">→</div>
        <div class="after"><span class="tag">14 天後</span>一般流程已能穩定，問題在忙碌時的複雜欄位確認</div>
      </div>
    </div>
    <div class="row">
      <div class="rname">Eddy</div>
      <div class="pair">
        <div class="before"><span class="tag">主管的印象</span>都說沒問題，可能不願意講</div>
        <div class="arrow">→</div>
        <div class="after"><span class="tag">14 天後</span>不是不講，是一般問句問不出來</div>
      </div>
    </div>
    <div class="row">
      <div class="rname">Eva H</div>
      <div class="pair">
        <div class="before"><span class="tag">主管的印象</span>沒信心、學得比較慢</div>
        <div class="arrow">→</div>
        <div class="after"><span class="tag">14 天後</span>尖峰已有掌握，剩下的是少見情境的求助時點</div>
      </div>
    </div>
  </div>

  <footer>
    <p class="kicker">同樣是新人不提問、操作出錯或不敢獨立，<br><b>原因可能完全不同。</b></p>
    <div class="meta">
      <div class="brand">Traitty AI<small>人才決策・團隊互動 Copilot</small></div>
      <div class="badge">情境模擬案例</div>
    </div>
  </footer>
</body></html>
